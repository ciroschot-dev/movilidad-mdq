name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_URL
          command_timeout: 20m
          script: |
            set -eu

            if [ -z "$BACKEND_URL" ]; then
              echo "ERROR: falta la variable BACKEND_URL en GitHub Actions."
              exit 1
            fi

            cd ~/movilidad-mdq
            git checkout main
            git pull --ff-only origin main

            sudo docker compose --profile production config --quiet
            sudo docker compose build app
            sudo docker compose --profile production up -d --remove-orphans

            echo "Healthcheck: esperando HTTPS en $BACKEND_URL..."
            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -fsS --max-time 10 "${BACKEND_URL%/}/api-docs" | grep -q '"precio"'; then
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: el backend no respondio correctamente tras 300s."
              sudo docker compose ps
              sudo docker compose logs --tail=100 app caddy
              exit 1
            fi

            echo "OK: backend sano y publicado mediante HTTPS."
            sudo docker image prune -f
