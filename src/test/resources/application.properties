spring.application.name=movilidadMDQ-test
# Forzamos H2 y desactivamos importación de .env para que no pise con valores de producción
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Dummy Keys para evitar errores de carga de propiedades, los servicios deben ser mockeados
google.maps.api.key=TEST_KEY_NO_REAL
openweather.api.key=TEST_KEY_NO_REAL
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

app.admin.username=admin
app.admin.password=admin

# Desactivar importación de variables de entorno externas en tests
spring.config.import=

# OAuth2 Dummy
spring.security.oauth2.client.registration.google.client-id=test-id
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=profile,email

spring.main.allow-bean-definition-overriding=true
