spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

google.maps.api.key=TEST_KEY
openweather.api.key=TEST_KEY
# Dummy test secret only. Real JWT_SECRET must stay in the root .env file.
jwt.secret=test-only-jwt-secret-key-for-movilidad-mdq
jwt.expiration=86400000

app.admin.username=admin
app.admin.password=admin

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

spring.main.allow-bean-definition-overriding=true
spring.config.import=
