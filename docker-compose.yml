services:
  app:
    build: .
    container_name: movilidad-mdq-app
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: movilidad-mdq-caddy
    profiles:
      - production
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?BACKEND_DOMAIN debe estar definida en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
