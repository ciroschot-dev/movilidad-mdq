<!-- <google-map> viene de la librería oficial de Angular; ocupa todo el ancho y 400px de alto -->
<google-map [center]="centro" [zoom]="zoom" width="100%" height="400px">
  <!-- Con ruta, dibuja el camino y los marcadores A y B, y acerca el mapa para que entre entero -->
  @if (ruta(); as ruta) {
    <map-directions-renderer [directions]="ruta" />
  }
</google-map>
